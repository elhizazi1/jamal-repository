<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مثال جمال</title>
<meta name="description" content="Jamal Example: snippets, file-header commands and a terminal theme for RawanIDE.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../assets/site.css">
<script src="../../../assets/site.js" defer></script>
</head>
<body data-page="ext" data-root="../../../">
<div class="wrap">
  <header class="bar">
    <a class="brand" href="../../../"><img src="../../../icon.svg" alt="" width="30" height="30"><span data-i18n="brand">مستودع جمال</span></a>
    <div class="langs" data-langs role="group" aria-label="Language"></div>
  </header>

  <main>
    <div class="hero">
      <a class="crumb" href="../../../"><span aria-hidden="true">&#8249;</span><span data-i18n="back">كل الإضافات</span></a>
      <div class="hero-grid">
        <div class="ext-head">
          <img src="icon.svg" alt="" width="112" height="112">
          <div>
            <h1 data-ext-name>مثال جمال</h1>
            <p class="lead" data-ext-desc></p>
            <div class="meta" data-ext-meta></div>
          </div>
        </div>
        <div data-seal></div>
      </div>
    </div>

    <section aria-labelledby="inst-h">
      <h2 id="inst-h" data-i18n="e_install_title">ثبّتها من التطبيق</h2>
      <p class="hint" data-i18n="e_install_lead"></p>
      <div class="address">
        <div class="address-field" data-repo-url tabindex="0"></div>
        <button class="btn" type="button" data-copy-main>نسخ الرابط</button>
      </div>
      <p class="status" data-status data-state="checking" role="status">…</p>
    </section>

    <section aria-labelledby="snip-h">
      <h2 id="snip-h" data-i18n="e_snippets">مقتطفات الكود</h2>
      <p class="hint" data-i18n="e_snippets_hint"></p>
      <div class="panel" data-snippets></div>
    </section>

    <section aria-labelledby="cmd-h">
      <h2 id="cmd-h" data-i18n="e_commands">الأوامر</h2>
      <p class="hint" data-i18n="e_commands_hint"></p>
      <div class="panel" data-commands></div>
    </section>

    <section aria-labelledby="theme-h">
      <h2 id="theme-h" data-i18n="e_theme">سمة الطرفية</h2>
      <p class="hint"><strong data-theme-name></strong> &middot; <span data-i18n="e_theme_hint"></span></p>
      <div class="term" data-theme-preview aria-hidden="true"></div>
      <div class="swatches" data-swatches aria-hidden="true"></div>
    </section>

    <section aria-labelledby="det-h">
      <h2 id="det-h" data-i18n="e_details">تفاصيل الإضافة</h2>
      <dl class="facts" data-facts></dl>
      <p style="margin-top:16px"><a class="btn" style="display:inline-grid;place-items:center;text-decoration:none;border-radius:8px" data-download href="#">تنزيل ملف .r1</a></p>
    </section>

    <section aria-labelledby="log-h">
      <h2 id="log-h" data-i18n="e_changelog">ما الجديد</h2>
      <p>v1.0.0 &middot; <span data-changelog></span></p>
    </section>
  </main>
</div>

<footer>
  <div class="wrap">
    <span data-i18n="foot_note">كل إصدار يُنزَّل من GitHub ويُتحقَّق من SHA-256 قبل التثبيت.</span>
    <span><a href="https://rawanide.elhizazi.me/repositories" rel="noopener" data-i18n="foot_market">Market Plus</a></span>
  </div>
</footer>
